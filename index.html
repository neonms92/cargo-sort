<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cargo Bay: Oxygen Sort Protocol</title>
</head>
<body>
<script>
// Matching system: oxygen concentration as fractions, decimals, percents and pie charts.
// The game itself is the shared engine (engine/engine.js); see the interface notes there.
window.CARGO_MODE = (function(){
  const TAU=Math.PI*2;
  const choice=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  function gcd(a,b){ return b===0 ? a : gcd(b, a%b); }

  const VALUE_POOL_EASY=[
    {n:1,d:2},{n:1,d:4},{n:3,d:4},{n:1,d:5},{n:2,d:5},{n:3,d:5},{n:4,d:5},
    {n:1,d:10},{n:3,d:10},{n:7,d:10},{n:9,d:10}
  ];
  const VALUE_POOL_HARD=[
    {n:1,d:8},{n:3,d:8},{n:5,d:8},{n:7,d:8},{n:1,d:20},{n:3,d:20},{n:1,d:25},{n:1,d:50}
  ];
  // Non-terminating decimals — introduced only in later sectors.
  const VALUE_POOL_REPEATING=[
    {n:1,d:3},{n:2,d:3},{n:1,d:6},{n:5,d:6},{n:1,d:9},{n:2,d:9},{n:4,d:9}
  ];
  function currentPool(sector){
    let pool = VALUE_POOL_EASY.slice();
    if(sector>=3) pool = pool.concat(VALUE_POOL_HARD);
    if(sector>=5) pool = pool.concat(VALUE_POOL_REPEATING);
    return pool;
  }
  // Chance that a fraction rock displays an unreduced equivalent (e.g. 3/12 instead of 1/4).
  // Ramps in gradually starting a couple of sectors after the harder denominators appear.
  function unreducedChance(sector){
    if(sector<=2) return 0;
    if(sector===3) return 0.2;
    if(sector===4) return 0.32;
    return 0.45;
  }
  function makeValue(n,d){
    const g=gcd(n,d);
    n/=g; d/=g;
    return {n,d,decimal:n/d, key:n+'/'+d};
  }
  function isTerminating(d){
    let x=d;
    while(x%2===0) x/=2;
    while(x%5===0) x/=5;
    return x===1;
  }
  function fmtDecimal(x, repeating){
    let s = x.toFixed(repeating?2:3);
    if(!repeating) s = s.replace(/0+$/,'').replace(/\.$/,'');
    if(!s.startsWith('0') && x<1) s = '0'+s;
    return s;
  }
  function fmtPercent(x, repeating){
    let p = x*100;
    if(repeating) return Math.round(p)+'%';
    p = Math.round(p*100)/100;
    return (Number.isInteger(p)?p.toString():p.toFixed(p*10%1===0?1:2)) + '%';
  }
  function fractionText(val, unreduced){
    if(unreduced){
      const k = choice([2,3,4]);
      return (val.n*k)+'/'+(val.d*k);
    }
    return val.n+'/'+val.d;
  }
  function valueText(val, rep, allowUnreduced){
    const repeating = !isTerminating(val.d);
    if(rep==='fraction') return fractionText(val, allowUnreduced);
    if(rep==='decimal') return fmtDecimal(val.decimal, repeating);
    return fmtPercent(val.decimal, repeating);
  }
  // Pictographic fractions: only these reduced denominators can be shown as a pie.
  const PIE_DENOMS=[2,3,4,5];
  function pickRep(val){
    const reps=['fraction','decimal','percent'];
    if(PIE_DENOMS.includes(val.d)) reps.push('pie');
    return choice(reps);
  }
  // SVG markup for the scanner readout.
  function pieSVG(n,d){
    const r=44; let paths='';
    for(let i=0;i<d;i++){
      const a0=-Math.PI/2+i*TAU/d, a1=a0+TAU/d;
      const x0=(Math.cos(a0)*r).toFixed(2), y0=(Math.sin(a0)*r).toFixed(2);
      const x1=(Math.cos(a1)*r).toFixed(2), y1=(Math.sin(a1)*r).toFixed(2);
      const fill = i<n ? '#5be6d9' : 'rgba(91,230,217,0.08)';
      paths += `<path d="M0 0 L${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1} Z" fill="${fill}" stroke="#0a0d12" stroke-width="3" stroke-linejoin="round"/>`;
    }
    return `<svg class="pie" viewBox="-50 -50 100 100" aria-label="${n} of ${d} slices">${paths}`+
           `<circle r="${r}" fill="none" stroke="#5be6d9" stroke-width="3"/></svg>`;
  }
  // Canvas pie for the barrel holograms. The first slice starts at 12 o'clock and runs clockwise.
  function drawPie(ctx,cx,cy,r,n,d,fill,empty,line){
    for(let i=0;i<d;i++){
      const a0=-Math.PI/2+i*TAU/d;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a0+TAU/d); ctx.closePath();
      ctx.fillStyle = i<n ? fill : empty; ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.strokeStyle='#0a0d12'; ctx.lineWidth=Math.max(1.2,r*0.08);
    for(let i=0;i<d;i++){
      const a=-Math.PI/2+i*TAU/d;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); ctx.stroke();
    }
    ctx.strokeStyle=line; ctx.lineWidth=Math.max(1,r*0.06);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
  }

  return {
    id: 'o2',
    title: 'OXYGEN SORT',
    intro: "Sort the rocks by their oxygen content.",
    scanLabel: 'O2 CONCENTRATION',
    pickValue(sector){
      const pair = choice(currentPool(sector));
      return makeValue(pair.n, pair.d);
    },
    makeItem(value, sector){
      const rep = pickRep(value);
      const allowUnreduced = (rep==='fraction'||rep==='pie') && Math.random()<unreducedChance(sector);
      if(rep==='pie'){
        // The only unreduced pie that stays within the whitelist is halves drawn as quarters.
        const k = allowUnreduced && value.d*2<=PIE_DENOMS[PIE_DENOMS.length-1] ? 2 : 1;
        const pie={n:value.n*k, d:value.d*k};
        return {rep, text:pie.n+'/'+pie.d, glyph:pie};
      }
      return {rep, text:valueText(value, rep, allowUnreduced)};
    },
    same(a,b){ return Math.abs(a.decimal-b.decimal) < 0.0005; },
    repLabel(item){ return 'REPRESENTATION: ' + (item.glyph ? 'PICTOGRAPH' : item.rep.toUpperCase()); },
    readoutHTML(item){ return item.glyph ? pieSVG(item.glyph.n, item.glyph.d) : null; },
    drawGlyph(ctx, glyph, x, y, r, col){ drawPie(ctx, x, y, r, glyph.n, glyph.d, col.fill, col.empty, col.line); return true; },
  };
})();
</script>
<script>
// Load the shared engine, passing on this page's ?v= cache-buster (see the engine's live update).
(function(){ var v=/[?&]v=(\d+)/.exec(location.search);
  document.write('<script data-cargo-engine src="engine/engine.js'+(v?'?v='+v[1]:'')+'"><\/script>'); })();
</script>
</body>
</html>
