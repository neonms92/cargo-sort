<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cargo Bay: Conjugation Sort Protocol</title>
</head>
<body>
<script>
// Matching system: Spanish verb conjugation. Each rock carries one form of a verb (tengo, tuvo,
// tendrán); barrels match on the verb it comes from. While a rock is held, the scanner names the
// form in English grammar terms (preterite, 2nd person singular, ...) with an example phrase
// that uses "verb" as the verb ("they verbed").
// The game itself is the shared engine (../engine/engine.js); see the interface notes there.
// Forms are built from the regular endings plus each verb's irregulars, written out in full where
// a rule would be fiddly. Vosotros is left out (Latin American usage). A form shared by two verbs
// (fui: ser and ir; ve: ir and ver) has no single right barrel, so it's dropped from both.
window.CARGO_MODE = (function(){
  const choice=(arr)=>arr[Math.floor(Math.random()*arr.length)];

  // persons: yo, tú, él/ella/usted, nosotros, ellos/ellas/ustedes
  const PERSONS = ['1ST PERSON SINGULAR','2ND PERSON SINGULAR','3RD PERSON SINGULAR','1ST PERSON PLURAL','3RD PERSON PLURAL'];
  // yo and él share a form in several tenses (hablaba, hable): "1ST OR 3RD PERSON SINGULAR"
  const personText = ps => ps.length===1 ? PERSONS[ps[0]]
    : ps.map(p=>PERSONS[p].split(' ')[0]).join(' OR ') + ' PERSON ' + PERSONS[ps[0]].split(' ')[2];
  // tense: [scanner name, first difficulty band it appears in (see CARGO_BAND in the engine)]
  const TENSES = {
    inf:  ['INFINITIVE', 0],
    pres: ['PRESENT', 0],
    ger:  ['PROGRESSIVE (-ING)', 0],
    pret: ['PRETERITE (PAST)', 1],
    fut:  ['FUTURE', 1],
    part: ['PAST PARTICIPLE', 1],
    imp:  ['IMPERFECT (PAST)', 2],
    cond: ['CONDITIONAL', 2],
    subj: ['PRESENT SUBJUNCTIVE', 2],
    cmd:  ['COMMAND (TÚ)', 2],
  };
  // English example under the label, with "verb" standing in for the verb: "they verbed"
  const WHO = ['I','you','he/she','we','they'];
  const EXAMPLE = {
    inf:  ()=> 'to verb',
    ger:  ()=> 'is verbing',
    part: ()=> 'has verbed',
    pres: (s,p)=> s + (p===2 ? ' verbs' : ' verb'),
    pret: s=> s + ' verbed',
    fut:  s=> s + ' will verb',
    imp:  (s,p)=> s + (p===0||p===2 ? ' was verbing' : ' were verbing'),
    cond: s=> s + ' would verb',
    subj: s=> 'that ' + s + ' verb',
    cmd:  ()=> 'Verb!',
  };
  const example = (tense, ps)=> EXAMPLE[tense](ps.map(p=>WHO[p]).join(' or '), ps[0]);
  // English for the explanation after a drop: each verb's English forms [base, -s, past, participle, -ing].
  // A verb made with "to be" gives just what follows it (ser/estar: nothing; poder: "able to", though
  // in the tenses where English has them it's "can" and "could").
  const ENGLISH = {
    hablar:['speak','speaks','spoke','spoken','speaking'], comer:['eat','eats','ate','eaten','eating'],
    vivir:['live','lives','lived','lived','living'],       tener:['have','has','had','had','having'],
    ser:{be:''}, estar:{be:''}, poder:{be:' able to'},
    ir:['go','goes','went','gone','going'],                hacer:['do','does','did','done','doing'],
    querer:['want','wants','wanted','wanted','wanting'],   decir:['say','says','said','said','saying'],
    venir:['come','comes','came','come','coming'],         saber:['know','knows','knew','known','knowing'],
    poner:['put','puts','put','put','putting'],            salir:['leave','leaves','left','left','leaving'],
    dormir:['sleep','sleeps','slept','slept','sleeping'],  pedir:['ask for','asks for','asked for','asked for','asking for'],
    ver:['see','sees','saw','seen','seeing'],
    cantar:['sing','sings','sang','sung','singing'],       bailar:['dance','dances','danced','danced','dancing'],
    beber:['drink','drinks','drank','drunk','drinking'],   escribir:['write','writes','wrote','written','writing'],
    leer:['read','reads','read','read','reading'],         vender:['sell','sells','sold','sold','selling'],
    perder:['lose','loses','lost','lost','losing'],        sacar:['take out','takes out','took out','taken out','taking out'],
    dar:['give','gives','gave','given','giving'],          haber:['have','has','had','had','having'],
    traer:['bring','brings','brought','brought','bringing'], caer:['fall','falls','fell','fallen','falling'],
    creer:['believe','believes','believed','believed','believing'], conocer:['know','knows','knew','known','knowing'],
    conducir:['drive','drives','drove','driven','driving'], pensar:['think','thinks','thought','thought','thinking'],
    pasar:['pass','passes','passed','passed','passing'],   deber:['owe','owes','owed','owed','owing'],
    hallar:['find','finds','found','found','finding'],     correr:['run','runs','ran','run','running'],
  };
  const AM=['am','are','is','are','are'], WAS=['was','were','was','were','were'];
  function english(inf, tense, ps){
    const e=ENGLISH[inf], who=ps.map(p=>WHO[p]).join(' or '), p=ps[0];
    if(inf==='poder' && /^(pres|pret|imp|cond|subj)$/.test(tense))
      return (tense==='subj' ? 'that ' : '') + who + (tense==='pres'||tense==='subj' ? ' can' : ' could');
    if(e.be!==undefined){
      const x=e.be;
      return {inf:'to be'+x, ger:'being'+x, part:'been'+x, pres:who+' '+AM[p]+x, pret:who+' '+WAS[p]+x, imp:who+' '+WAS[p]+x,
              fut:who+' will be'+x, cond:who+' would be'+x, subj:'that '+who+' be'+x, cmd:'Be'+x+'!'}[tense];
    }
    const [base, s, past, pp, ing]=e;
    return {inf:'to '+base, ger:ing, part:pp, pres:who+' '+(p===2?s:base), pret:who+' '+past, imp:who+' '+WAS[p]+' '+ing,
            fut:who+' will '+base, cond:who+' would '+base, subj:'that '+who+' '+base,
            cmd:base[0].toUpperCase()+base.slice(1)+'!'}[tense];
  }
  const ENDINGS = {
    ar: {pres:['o','as','a','amos','an'], pret:['é','aste','ó','amos','aron'], imp:['aba','abas','aba','ábamos','aban'], subj:['e','es','e','emos','en']},
    er: {pres:['o','es','e','emos','en'], pret:['í','iste','ió','imos','ieron'], imp:['ía','ías','ía','íamos','ían'], subj:['a','as','a','amos','an']},
    ir: {pres:['o','es','e','imos','en'], pret:['í','iste','ió','imos','ieron'], imp:['ía','ías','ía','íamos','ían'], subj:['a','as','a','amos','an']},
  };
  const FUT = ['é','ás','á','emos','án'], COND = ['ía','ías','ía','íamos','ían'];

  // Anything not given follows the regular pattern:
  // full arrays (pres, pret, imp, subj) or yo (present yo only), futStem, ger, part, cmd (null = none).
  const VERBS = {
    hablar: {},
    comer:  {},
    vivir:  {},
    tener:  {pres:['tengo','tienes','tiene','tenemos','tienen'], pret:['tuve','tuviste','tuvo','tuvimos','tuvieron'], futStem:'tendr', cmd:'ten'},
    ser:    {pres:['soy','eres','es','somos','son'], pret:['fui','fuiste','fue','fuimos','fueron'], imp:['era','eras','era','éramos','eran'],
             subj:['sea','seas','sea','seamos','sean'], ger:'siendo', cmd:'sé'},
    ir:     {pres:['voy','vas','va','vamos','van'], pret:['fui','fuiste','fue','fuimos','fueron'], imp:['iba','ibas','iba','íbamos','iban'],
             subj:['vaya','vayas','vaya','vayamos','vayan'], ger:'yendo', cmd:'ve'},
    hacer:  {yo:'hago', pret:['hice','hiciste','hizo','hicimos','hicieron'], futStem:'har', part:'hecho', cmd:'haz'},
    poder:  {pres:['puedo','puedes','puede','podemos','pueden'], pret:['pude','pudiste','pudo','pudimos','pudieron'], futStem:'podr',
             subj:['pueda','puedas','pueda','podamos','puedan'], ger:'pudiendo', cmd:null},
    querer: {pres:['quiero','quieres','quiere','queremos','quieren'], pret:['quise','quisiste','quiso','quisimos','quisieron'], futStem:'querr',
             subj:['quiera','quieras','quiera','queramos','quieran'], cmd:null},
    decir:  {pres:['digo','dices','dice','decimos','dicen'], pret:['dije','dijiste','dijo','dijimos','dijeron'], futStem:'dir',
             ger:'diciendo', part:'dicho', cmd:'di'},
    venir:  {pres:['vengo','vienes','viene','venimos','vienen'], pret:['vine','viniste','vino','vinimos','vinieron'], futStem:'vendr',
             ger:'viniendo', cmd:'ven'},
    estar:  {pres:['estoy','estás','está','estamos','están'], pret:['estuve','estuviste','estuvo','estuvimos','estuvieron'],
             subj:['esté','estés','esté','estemos','estén']},
    saber:  {yo:'sé', pret:['supe','supiste','supo','supimos','supieron'], futStem:'sabr', subj:['sepa','sepas','sepa','sepamos','sepan']},
    poner:  {yo:'pongo', pret:['puse','pusiste','puso','pusimos','pusieron'], futStem:'pondr', part:'puesto', cmd:'pon'},
    salir:  {yo:'salgo', futStem:'saldr', cmd:'sal'},
    dormir: {pres:['duermo','duermes','duerme','dormimos','duermen'], pret:['dormí','dormiste','durmió','dormimos','durmieron'],
             subj:['duerma','duermas','duerma','durmamos','duerman'], ger:'durmiendo'},
    pedir:  {pres:['pido','pides','pide','pedimos','piden'], pret:['pedí','pediste','pidió','pedimos','pidieron'],
             subj:['pida','pidas','pida','pidamos','pidan'], ger:'pidiendo'},
    ver:    {pres:['veo','ves','ve','vemos','ven'], pret:['vi','viste','vio','vimos','vieron'], imp:['veía','veías','veía','veíamos','veían'],
             subj:['vea','veas','vea','veamos','vean'], ger:'viendo', part:'visto'},
    cantar: {}, bailar: {}, beber: {}, vender: {},
    escribir: {part:'escrito'},
    leer:   {pret:['leí','leíste','leyó','leímos','leyeron'], ger:'leyendo', part:'leído'},
    perder: {pres:['pierdo','pierdes','pierde','perdemos','pierden'], subj:['pierda','pierdas','pierda','perdamos','pierdan']},
    sacar:  {pret:['saqué','sacaste','sacó','sacamos','sacaron'], subj:['saque','saques','saque','saquemos','saquen']},
    dar:    {pres:['doy','das','da','damos','dan'], pret:['di','diste','dio','dimos','dieron'], subj:['dé','des','dé','demos','den']},
    haber:  {pres:['he','has','ha','hemos','han'], pret:['hube','hubiste','hubo','hubimos','hubieron'], futStem:'habr',
             subj:['haya','hayas','haya','hayamos','hayan'], cmd:null},
    traer:  {yo:'traigo', pret:['traje','trajiste','trajo','trajimos','trajeron'], ger:'trayendo', part:'traído'},
    caer:   {yo:'caigo', pret:['caí','caíste','cayó','caímos','cayeron'], ger:'cayendo', part:'caído'},
    creer:  {pret:['creí','creíste','creyó','creímos','creyeron'], ger:'creyendo', part:'creído'},
    conocer:{yo:'conozco'},
    conducir:{yo:'conduzco', pret:['conduje','condujiste','condujo','condujimos','condujeron']},
    pensar: {pres:['pienso','piensas','piensa','pensamos','piensan'], subj:['piense','pienses','piense','pensemos','piensen']},
    pasar: {}, deber: {}, hallar: {}, correr: {},
  };
  // Which verbs go on the barrels together. Learning: plain verbs with stems that look nothing alike.
  // Gets it: one stem changes. Invested: one changes past recognition (ser: fue, era; ir: iba, vaya).
  // Deciding and committed: one or two look-alike pairs (pude/puse). Impressive on: a whole family of
  // look-alike stems (vino, vio, vendió, vivió). Near misses: a look-alike of a barrel's verb.
  const STARTERS = ['hablar','comer','vivir','tener','cantar','bailar','beber','escribir'];
  const CHANGERS = ['tener','hacer','querer','poder','decir','venir','perder','dormir','pedir','estar'];
  const SUPPLETIVE = ['ser','ir'];
  const PAIRS = [['poder','poner'],['ser','estar'],['ir','ver'],['venir','ver'],['venir','vender'],['saber','salir'],
                 ['tener','traer'],['decir','dar'],['hacer','haber'],['caer','traer'],['creer','leer'],['conocer','conducir'],
                 ['pedir','perder'],['vivir','ver'],['ser','saber'],['ir','ser'],['sacar','saber'],
                 ['pensar','perder'],['comer','correr'],['decir','deber'],['hablar','hallar']];
  const FAMILIES = [['venir','ver','vender','vivir'], ['saber','salir','sacar','ser'], ['poner','poder','pedir','perder','pensar','pasar'],
                    ['tener','traer','caer','creer','leer'], ['hacer','haber','hablar','hallar'], ['conocer','conducir','comer','correr'],
                    ['ir','ver','ser','estar'], ['decir','dar','dormir','deber']];

  // Every form of one verb as [text, tense, person|null].
  function conjugate(inf, v){
    const cls = inf.slice(-2), stem = inf.slice(0,-2), E = ENDINGS[cls];
    const pres = v.pres || E.pres.map((e,i)=> i===0 && v.yo ? v.yo : stem+e);
    // the subjunctive grows from the present yo form: tengo → tenga
    const subjStem = pres[0].endsWith('o') ? pres[0].slice(0,-1) : stem;
    const futStem = v.futStem || inf;
    const out = [[inf,'inf',null], [v.ger || stem+(cls==='ar'?'ando':'iendo'),'ger',null], [v.part || stem+(cls==='ar'?'ado':'ido'),'part',null]];
    const add = (tense, forms)=> forms.forEach((f,i)=> out.push([f, tense, i]));
    add('pres', pres);
    add('pret', v.pret || E.pret.map(e=>stem+e));
    add('fut',  FUT.map(e=>futStem+e));
    add('imp',  v.imp || E.imp.map(e=>stem+e));
    add('cond', COND.map(e=>futStem+e));
    add('subj', v.subj || E.subj.map(e=>subjStem+e));
    const cmd = v.cmd===undefined ? pres[2] : v.cmd;   // regular tú command = él present
    if(cmd) out.push([cmd,'cmd',null]);
    return out;
  }

  // FORMS[verb] = [{text, from, desc}]: one entry per distinct spelling, all its readings merged.
  const owners = {};          // text → set of verbs
  const raw = {};
  for(const inf in VERBS){
    raw[inf] = conjugate(inf, VERBS[inf]);
    raw[inf].forEach(([t])=> (owners[t] = owners[t] || new Set()).add(inf));
  }
  const FORMS = {}, DESC = {}, TRANS = {};
  for(const inf in raw){
    const byText = new Map();
    raw[inf].forEach(([t, tense, p])=>{
      if(owners[t].size>1) return;       // shared with another verb: ambiguous, drop
      if(!byText.has(t)) byText.set(t, new Map());
      const byTense = byText.get(t);
      if(!byTense.has(tense)) byTense.set(tense, []);
      if(p!==null) byTense.get(tense).push(p);
    });
    FORMS[inf] = [...byText].map(([text, byTense])=>{
      // tenses read with the same persons share one label: "PRESENT OR PRETERITE · 1ST PERSON PLURAL"
      const groups = new Map();
      byTense.forEach((ps, tense)=>{
        const k = ps.join();
        if(!groups.has(k)) groups.set(k, {ps, names:[]});
        groups.get(k).names.push(TENSES[tense][0]);
      });
      const desc = [...groups.values()].map(({ps, names})=>
        names.join(' OR ') + (ps.length ? ' · ' + personText(ps) : '')).join('  OR  ');
      const examples = [...byTense].map(([tense, ps])=> '"' + example(tense, ps) + '"').join(' / ');
      // a form shows up once any tense it can be read as has appeared
      const from = Math.min(...[...byTense.keys()].map(k=>TENSES[k][1]));
      DESC[text] = desc + '\n' + examples;
      TRANS[text] = [...new Set([...byTense].map(([tense, ps])=> english(inf, tense, ps)))].join(' / ');
      return {text, from};
    });
  }

  const shuffle = a => a.slice().sort(()=>Math.random()-0.5);
  const pairedWith = v => PAIRS.filter(p=>p.includes(v)).map(p=>p[0]===v ? p[1] : p[0]);
  function planSector(sector, band){
    let verbs = [];
    const add = v => { if(v && !verbs.includes(v)) verbs.push(v); };
    const addPair = () => {
      for(let t=0;t<30;t++){ const p=choice(PAIRS); if(p.every(v=>!verbs.includes(v))){ p.forEach(add); return; } }
    };
    const apart = v => !pairedWith(v).some(x=>verbs.includes(x));
    if(band.i>=5){
      shuffle(choice(FAMILIES)).slice(0,4).forEach(add);
    } else if(band.i>=3){
      addPair(); if(band.i===4) addPair();
    } else if(band.i===2){
      add(choice(SUPPLETIVE)); add(choice(CHANGERS.filter(apart)));
    } else if(band.i===1){
      add(choice(CHANGERS));
    }
    const fill = band.i===0 ? STARTERS : band.i<=2 ? STARTERS.concat(CHANGERS) : Object.keys(VERBS);
    for(const v of shuffle(fill)){ if(verbs.length>=4) break; if(band.i>=3 || apart(v)) add(v); }
    let decoys = [];
    if(band.i>=3){
      decoys = [...new Set(verbs.flatMap(pairedWith))].filter(v=>!verbs.includes(v));
      if(band.i>=5) FAMILIES.forEach(f=>{ if(verbs.every(v=>f.includes(v))) f.forEach(v=>{ if(!verbs.includes(v)) decoys.push(v); }); });
      // nothing left over: any verb that starts like one on the barrels, or else ends like one (deber, beber)
      const like = f => Object.keys(VERBS).filter(v=>!verbs.includes(v) && verbs.some(x=>f(x)===f(v)));
      if(!decoys.length) decoys = like(v=>v.slice(0,1));
      if(!decoys.length) decoys = like(v=>v.slice(-3));
      decoys = [...new Set(decoys)];
    }
    return {values: verbs.map(key=>({key})), decoys: decoys.map(key=>({key}))};
  }

  const recent = [];   // don't repeat a form for a while

  return {
    id: 'conjugation',
    title: 'CONJUGATION SORT',
    intro: "Sort the verbs by their infinitive.",
    scanLabel: 'SPECIMEN TAG',
    pickValue(sector){ return {key: choice(STARTERS)}; },
    planSector,
    makeItem(value, sector, labels){
      const band = CARGO_BAND(sector).i;
      const all = FORMS[value.key].filter(f=>band>=f.from).map(f=>f.text);
      // skip forms the barrels are already showing; prefer forms not seen lately
      const fresh = all.filter(t=>!(labels||[]).includes(t));
      let pool = fresh.filter(t=>!recent.includes(t));
      if(!pool.length) pool = fresh.length ? fresh : all;
      const text = choice(pool);
      recent.push(text); if(recent.length>12) recent.shift();
      return {rep:'verb', text};
    },
    // looked up by text, so a rock restored from a save still gets its description
    repLabel(item){ return DESC[item.text] || ''; },
    translate(text){ return TRANS[text] || ''; },
  };
})();
</script>
<script>
// Load the shared engine, passing on this page's ?v= cache-buster (see the engine's live update).
(function(){ var v=/[?&]v=(\d+)/.exec(location.search);
  document.write('<script data-cargo-engine src="../engine/engine.js'+(v?'?v='+v[1]:'')+'"><\/script>'); })();
</script>
</body>
